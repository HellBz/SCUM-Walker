name: Content Release

on:
  push:
    branches:
      - content
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4

      - name: Pack hi-res tiles
        run: |
          cd tools/tiles-hires
          zip -r ../../tiles-hires.zip 4 5 6
          cd ../..
          ls -lh tiles-hires.zip

      - name: Create or update content release
        run: |
          gh release delete content --yes --cleanup-tag || true
          gh release create content --title "High-Resolution Map Tiles" --notes "High-resolution SCUM map tiles (zoom 4-6) for the SCUM Walker app." --make-latest=false --target $(git rev-parse HEAD) tiles-hires.zip
        env:
          GH_TOKEN: ${{ github.token }}
