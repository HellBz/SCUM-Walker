name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend deps
        run: npm ci
        continue-on-error: true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SCUM Walker ${{ github.ref_name }}'
          releaseBody: |
            ## SCUM Walker ${{ github.ref_name }}

            ### Installation
            1. Installer für dein System herunterladen
            2. App starten
            3. In der App auf "⬇ Hi-Res Tiles" klicken für hochauflösende Karte
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-tiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack hi-res tiles into ZIP
        run: |
          cd tools/tiles-hires
          zip -r ../../tiles-hires.zip 4 5 6
          cd ../..
          ls -lh tiles-hires.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: tiles-hires.zip
          tag_name: ${{ github.ref_name }}
