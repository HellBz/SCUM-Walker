name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak

      - name: Install frontend deps
        run: npm ci
        continue-on-error: true

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app
            src-tauri/target/release/bundle/app/*.app.tar.gz.sig
          if-no-files-found: ignore

  build-tiles:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack hi-res tiles into ZIP
        run: |
          cd tools/tiles-hires
          zip -r ../../tiles-hires.zip 4 5 6
          cd ../..
          ls -lh tiles-hires.zip

      - name: Upload tiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiles-hires
          path: tiles-hires.zip
          if-no-files-found: warn

  release:
    needs: [build-app, build-tiles]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/HellBz/SCUM-Walker/releases/download/${TAG}"
          
          WIN_SIG=$(cat artifacts/*.exe.sig 2>/dev/null | head -1 || echo "")
          WIN_EXE="SCUM.Walker_${VERSION}_x64-setup.exe"
          
          echo "Windows sig: $WIN_SIG"
          echo "Windows exe: $WIN_EXE"
          
          PLATFORMS="\"windows-x86_64\":{\"signature\":\"$WIN_SIG\",\"url\":\"$BASE/$WIN_EXE\"}"
          
          PUBDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "version": "%s",\n  "notes": "SCUM Walker %s",\n  "pub_date": "%s",\n  "platforms": {\n    %s\n  }\n}\n' "$VERSION" "$TAG" "$PUBDATE" "$PLATFORMS" > artifacts/latest.json
          
          cat artifacts/latest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'SCUM Walker ${{ github.ref_name }}'
          body: |
            ## SCUM Walker ${{ github.ref_name }}

            ### Installation / Installation
            1. Download the installer for your system / Installer für dein System herunterladen
            2. Start the app / App starten
            3. Click "⬇ Hi-Res Tiles" in the app for high-resolution map / In der App auf "⬇ Hi-Res Tiles" klicken für hochauflösende Karte

            ### Auto-Update / Automatisches Update
            - Windows: Click "Update verfügbar" in the sidebar to automatically download and install / Klicke auf "Update verfügbar" in der Sidebar zum automatischen Download und Installation
            - Linux/macOS: Click the link to open the release page / Klicke auf den Link um die Release-Seite zu öffnen
          draft: false
          prerelease: false
          files: artifacts/**/*
