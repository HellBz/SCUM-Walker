<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCUM Walker</title>
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-title">
      <span class="brand">SCUM Walker</span>
    </div>

    <div id="status">Bereit</div>
    <div id="scumStatus" class="scum-status running">SCUM: läuft</div>

    <div class="section">
      <h3>Live-Map</h3>
      <div class="button-row">
        <button id="toggleLiveTracking">Live-Tracking starten</button>
      </div>
      <div class="button-row">
        <button id="openOverlay" title="Overlay öffnen">Overlay öffnen</button>
      </div>
      <div style="height:6px"></div>
      <div class="button-row overlay-actions">
        <button id="lockOverlay" title="Overlay sperren / Klick-durch">🔒</button>
        <button id="closeOverlay" title="Overlay schließen">✕</button>
        <button id="resetOverlayPosition" title="Overlay-Position zurücksetzen">↺</button>
      </div>
      <div style="height:6px"></div>
      <label class="url-label">URL für OBS/Browser:</label>
      <div class="url-row">
        <input id="livemapUrl" type="text" value="http://127.0.0.1:4488/livemap.html" readonly>
        <button id="copyLivemapUrl" title="URL kopieren">⎘</button>
      </div>
      <div style="height:6px"></div>
      <div class="button-row">
        <button id="downloadHiresBtn" title="Hochauflösende Karten-Tiles herunterladen">⬇ Hi-Res Tiles</button>
      </div>
      <div id="hiresStatus" style="font-size:11px;color:#888;margin-top:4px"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h3>Routen</h3>
        <button id="addRouteBtn" class="icon-btn" title="Neue Route">＋</button>
      </div>
      <div id="routeList"></div>
      <div class="export-row">
        <button id="exportJson">JSON exportieren</button>
        <button id="exportCsv">CSV exportieren</button>
      </div>
    </div>

    <div class="section">
      <h3>POIs</h3>
      <button id="addPoiFromLocation">Aktuelle Position als POI</button>
      <p class="hint">Oder Rechtsklick auf die Karte.</p>
      <div id="poiList"></div>
    </div>
  </div>

  <div id="mapShell">
    <div id="map"></div>
    <div id="mapControls">
      <button id="mapZoomOut" title="Herauszoomen">−</button>
      <span id="mapZoomLabel">100%</span>
      <button id="mapZoomIn" title="Hineinzoomen">+</button>
      <button id="mapFollowBtn" title="Aktueller Position folgen">◎</button>
      <button id="mapCenterBtn" title="Auf aktuelle Position zentrieren">⛯</button>
      <button id="mapFitBtn" title="Gesamte Karte anzeigen">⛶</button>
    </div>
  </div>

  <div id="routeDialog" class="dialog">
    <div class="dialog-content">
      <h3>Neue Route</h3>
      <input type="text" id="routeNameInput" placeholder="Name der Route" maxlength="64">
      <div class="custom-color-row">
        <input type="color" id="routeColorPicker" value="#00ffcc">
      </div>
      <div id="routeColors" class="color-grid"></div>
      <div class="dialog-actions">
        <button id="routeCancel">Abbrechen</button>
        <button id="routeSave">Erstellen</button>
      </div>
    </div>
  </div>

  <div id="poiDialog" class="dialog">
    <div class="dialog-content">
      <h3 id="poiDialogTitle">POI hinzufügen</h3>
      <input type="text" id="poiLabel" placeholder="Name" maxlength="64">
      <div class="custom-color-row">
        <input type="color" id="poiColorPicker" value="#ff44d3">
      </div>
      <div id="poiColors" class="color-grid"></div>
      <div class="dialog-actions">
        <button id="poiCancel">Abbrechen</button>
        <button id="poiSave">Speichern</button>
      </div>
    </div>
  </div>

  <div id="imageDialog" class="dialog">
    <div class="dialog-content image-dialog-content">
      <h3 id="imageDialogTitle">POI Bild</h3>
      <img id="imageDialogImg" alt="POI Bild">
      <div class="dialog-actions">
        <button id="imageDialogClose">Schließen</button>
      </div>
    </div>
  </div>

  <script src="lib/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
