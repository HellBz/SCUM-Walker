<body>
  <div id="dragHandle" title="Ziehen zum Verschieben">
    <span>SCUM Walker Overlay</span>
    <button id="overlayClose" title="Overlay schließen">×</button>
  </div>
  <div id="controls">
    <button id="zoomOut" title="Herauszoomen">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" title="Hineinzoomen">+</button>
    <button id="followBtn" title="Aktueller Position folgen">◎</button>
    <button id="centerBtn" title="Auf aktuelle Position zentrieren">⛯</button>
    <button id="fitBtn" title="Gesamte Karte anzeigen">⛶</button>
    <button id="toggleCoords" title="Koordinaten anzeigen/ausblenden">XY</button>
    <button id="toggleCluster" title="POI-Clustering an/aus"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></button>
  </div>
  <div id="mapShell">
    <div id="map"></div>
  </div>
  <div id="status">Warte auf Daten...</div>
  <div id="toast" class="toast"></div>
  <script>window.__WS_PORT__ = "{{WS_PORT}}";</script>
  <script src="lib/leaflet.js"></script>
