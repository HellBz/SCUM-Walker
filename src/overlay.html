<!DOCTYPE html>
<html lang="de" style="background:transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCUM Walker Overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    body:hover #bar { opacity: 1; }
    #bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 28px;
      background: rgba(10, 15, 15, 0.85);
      border-bottom: 1px solid #00ffcc55;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 8px;
      font-size: 12px;
      user-select: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      -webkit-app-region: drag;
      app-region: drag;
    }
    #bar span { font-weight: bold; color: #00ffcc; margin-right: 6px; pointer-events: none; }
    #bar .controls { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; app-region: no-drag; }
    #bar input[type="range"] { width: 70px; height: 14px; }
    #bar button {
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 3px;
      cursor: pointer;
      width: 22px;
      height: 18px;
      padding: 0;
      font-size: 12px;
      line-height: 1;
    }
    #bar button:hover { border-color: #00ffcc; color: #00ffcc; }
    #mapFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>SCUM Walker Overlay</span>
    <div class="controls">
      <input type="range" id="opacitySlider" min="20" max="100" value="85" title="Deckkraft">
      <button id="closeBtn" title="Ausblenden">×</button>
    </div>
  </div>
  <iframe id="mapFrame" src="http://127.0.0.1:4488/livemap.html?overlay=1" allowtransparency></iframe>
  <script src="overlay.js"></script>
</body>
</html>
