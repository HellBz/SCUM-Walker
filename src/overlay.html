<!DOCTYPE html>
<html lang="de" style="background:transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCUM Walker Overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    #bar {
      height: 28px;
      background: rgba(10, 15, 15, 0.85);
      border-bottom: 1px solid #00ffcc55;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 12px;
      user-select: none;
    }
    #bar span { font-weight: bold; color: #00ffcc; }
    #bar button {
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 3px;
      cursor: pointer;
      width: 22px;
      height: 18px;
      padding: 0;
      margin-left: 4px;
      font-size: 12px;
      line-height: 1;
    }
    #bar button:hover { border-color: #00ffcc; color: #00ffcc; }
    #bar button.locked { color: #ff4444; border-color: #ff4444; }
    #mapFrame {
      width: 100%;
      height: calc(100% - 28px);
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="bar" data-tauri-drag-region>
    <span data-tauri-drag-region>SCUM Walker Overlay</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <input type="range" id="opacitySlider" min="20" max="100" value="85" title="Deckkraft" style="width:70px;height:14px;">
      <button id="lockBtn" title="Klick-durchlässig umschalten">🔒</button>
      <button id="closeBtn" title="Ausblenden">×</button>
    </div>
  </div>
  <iframe id="mapFrame" src="http://127.0.0.1:4488/livemap.html?overlay=1" allowtransparency></iframe>
  <script src="overlay.js"></script>
</body>
</html>
