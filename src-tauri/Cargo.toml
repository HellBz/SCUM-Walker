[package]
name = "scum-walker-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
enigo = "0.2"
arboard = "3.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics", "Win32_Graphics_Gdi"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
