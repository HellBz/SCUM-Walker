[package]
name = "scum-walker-tauri"
version = "0.8.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
enigo = "0.2"
arboard = "3.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Security"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
axum = { version = "0.7", features = ["ws"] }
rfd = "0.14"
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1"
zip = "2.1"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
